name: Bug report
description: Something does not work as expected
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead? Do not attach private audio or transcripts.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS Intel, macOS Apple Silicon, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or screenshot
      description: The log file is in the application data folder (logs/). Remove anything private.
