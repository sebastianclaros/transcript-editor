name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:privacy
        if: matrix.os == 'ubuntu-latest'

  e2e:
    name: e2e (xvfb)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a --server-args="-screen 0 1280x900x24" npm run test:e2e
      - name: list leftover processes (diagnostics)
        if: failure()
        run: ps -eo pid,pgid,ppid,etime,args | grep -iE 'electron|crashpad|transcript' | grep -v grep || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-artifacts
          path: apps/desktop/e2e/artifacts
          if-no-files-found: ignore

  package-smoke:
    name: package smoke (linux)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run dist:dir
      - run: node apps/desktop/scripts/check-artifacts.cjs
      - run: xvfb-run -a ./apps/desktop/dist/linux-unpacked/transcript-editor --no-sandbox --smoke-test
